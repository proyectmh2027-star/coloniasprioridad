<style>
  :root{
    --bg:#0f1720; --panel:#16212c; --panel2:#1c2a37; --border:#2b3d4d;
    --text:#e8eef3; --muted:#9db0c0; --accent:#4fb0ff;
    --red:#E63946; --yellow:#FFB703; --green:#16A34A;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
  #app { display:flex; height:100vh; width:100vw; }
  #sidebar {
    width:340px; min-width:340px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #sidebar h1 { font-size:16px; margin:16px 16px 4px; }
  #sidebar .subtitle { margin:0 16px 14px; font-size:12px; color:var(--muted); }
  .controls { padding:0 16px 12px; border-bottom:1px solid var(--border); }
  .control-row { margin-bottom:12px; }
  .control-row label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .control-row .value { color:var(--accent); font-weight:bold; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=text] {
    width:100%; padding:6px 8px; background:var(--panel2); border:1px solid var(--border);
    color:var(--text); border-radius:6px; font-size:13px;
  }
  .chip-row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip {
    display:flex; align-items:center; gap:6px; padding:5px 10px; background:var(--panel2);
    border:1px solid var(--border); border-radius:20px; font-size:12px; cursor:pointer; user-select:none;
  }
  .chip input { cursor:pointer; }
  .dist3 .swatch { background:#4fb0ff; }
  .dist8 .swatch { background:#ff9f4f; }
  .swatch { width:9px; height:9px; border-radius:50%; display:inline-block; }
  #legend { padding:12px 16px; border-bottom:1px solid var(--border); font-size:12px; }
  #legend .bar { height:10px; border-radius:5px; background:linear-gradient(90deg, var(--red), var(--yellow), var(--green)); margin:6px 0; }
  #legend .labels { display:flex; justify-content:space-between; color:var(--muted); }
  #count { padding:10px 16px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--border); }
  #list { flex:1; overflow-y:auto; padding:6px 0; }
  .item {
    padding:9px 16px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; gap:10px; align-items:center;
  }
  .item:hover { background:var(--panel2); }
  .item .rank { font-size:11px; color:var(--muted); width:26px; flex-shrink:0; }
  .item .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .item .info { flex:1; min-width:0; }
  .item .name { font-size:13px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .meta { font-size:11px; color:var(--muted); }
  .item .score { font-size:13px; font-weight:bold; color:var(--accent); width:34px; text-align:right; flex-shrink:0; }
  #map { flex:1; }
  .leaflet-popup-content-wrapper { background:var(--panel); color:var(--text); border-radius:8px; }
  .leaflet-popup-tip { background:var(--panel); }
  .popup h3 { margin:0 0 6px; font-size:14px; }
  .popup table { font-size:12px; border-collapse:collapse; }
  .popup td { padding:2px 6px 2px 0; color:var(--muted); }
  .popup td.v { color:var(--text); text-align:right; font-weight:bold; }
  .popup .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin-bottom:6px; color:#111; }
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>

const map = L.map('map', { zoomControl:true }).setView([25.72, -100.30], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

function colorFor(p){
  if (p === null || p === undefined || isNaN(p)) return '#555a60';
  const red = [230,57,70], yellow=[255,183,3], green=[22,163,74];
  let c1, c2, t;
  if (p <= 50) { c1 = red; c2 = yellow; t = p/50; } else { c1 = yellow; c2 = green; t = (p-50)/50; }
  const r = Math.round(c1[0] + (c2[0]-c1[0])*t);
  const g = Math.round(c1[1] + (c2[1]-c1[1])*t);
  const b = Math.round(c1[2] + (c2[2]-c1[2])*t);
  return `rgb(${r},${g},${b})`;
}

let layerGroup = L.geoJSON(null, {
  style: f => ({
    color: '#0b0f14', weight: 1, fillColor: colorFor(f.properties.prioridad), fillOpacity: 0.75
  }),
  onEachFeature: (f, layer) => {
    const p = f.properties;
    const badgeColor = colorFor(p.prioridad);
    const html = `<div class="popup">
      <span class="badge" style="background:${badgeColor}">Prioridad ${p.prioridad !== null && p.prioridad !== undefined ? p.prioridad.toFixed(1) : 'N/D'}</span>
      <h3>${p.NOMBRE}</h3>
      <table>
        <tr><td>Distrito</td><td class="v">${p.distrito}</td></tr>
        <tr><td>Ranking</td><td class="v">${p.ranking ? '#'+Math.round(p.ranking) : 'N/D'}</td></tr>
        <tr><td>Nomina</td><td class="v">${p.nomina !== null && p.nomina !== undefined ? Math.round(p.nomina).toLocaleString('es-MX') : 'N/D'}</td></tr>
        <tr><td>% votos MC 2024</td><td class="v">${p.pct_mc !== null && p.pct_mc !== undefined ? p.pct_mc.toFixed(1)+'%' : 'N/D'}</td></tr>
        <tr><td>Participacion</td><td class="v">${p.participacion !== null && p.participacion !== undefined ? p.participacion.toFixed(1)+'%' : 'N/D'}</td></tr>
        <tr><td>Poblacion 30+</td><td class="v">${p.pop_30mas !== null && p.pop_30mas !== undefined ? Math.round(p.pop_30mas).toLocaleString('es-MX') : 'N/D'}</td></tr>
        <tr><td>Poblacion 35+</td><td class="v">${p.pop_35mas !== null && p.pop_35mas !== undefined ? Math.round(p.pop_35mas).toLocaleString('es-MX') : 'N/D'}</td></tr>
      </table>
    </div>`;
    layer.bindPopup(html);
    layer._searchName = (p.NOMBRE || '').toLowerCase();
  }
}).addTo(map);

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const prioSlider = document.getElementById('prioSlider');
const prioVal = document.getElementById('prioVal');
const chkD3 = document.getElementById('chkD3');
const chkD8 = document.getElementById('chkD8');
const chkDato = document.getElementById('chkDatoCompleto');
const searchBox = document.getElementById('search');

let featureLayerMap = new Map();

function applyFilters(){
  const minPrio = parseInt(prioSlider.value, 10);
  prioVal.textContent = minPrio;
  const showD3 = chkD3.checked, showD8 = chkD8.checked;
  const onlyComplete = chkDato.checked;
  const query = searchBox.value.trim().toLowerCase();

  layerGroup.clearLayers();
  featureLayerMap.clear();

  const filtered = DATA.features.filter(f => {
    const p = f.properties;
    if (p.distrito === 3 && !showD3) return false;
    if (p.distrito === 8 && !showD8) return false;
    if (onlyComplete && !p.tiene_todo) return false;
    if (query && !(p.NOMBRE || '').toLowerCase().includes(query)) return false;
    const prio = (p.prioridad === null || p.prioridad === undefined) ? -1 : p.prioridad;
    if (prio < minPrio) return false;
    return true;
  });

  filtered.sort((a,b) => {
    const pa = a.properties.prioridad ?? -1, pb = b.properties.prioridad ?? -1;
    return pb - pa;
  });

  const fc = { type:'FeatureCollection', features: filtered };
  layerGroup.addData(fc);

  layerGroup.eachLayer(l => {
    featureLayerMap.set(l.feature.properties.NOMBRE + '|' + l.feature.properties.distrito, l);
  });

  countEl.textContent = `${filtered.length} colonias mostradas de ${DATA.features.length}`;

  listEl.innerHTML = '';
  filtered.forEach(f => {
    const p = f.properties;
    const div = document.createElement('div');
    div.className = 'item';
    const prio = p.prioridad !== null && p.prioridad !== undefined ? p.prioridad.toFixed(1) : 'N/D';
    div.innerHTML = `
      <span class="rank">${p.ranking ? '#'+Math.round(p.ranking) : '-'}</span>
      <span class="dot" style="background:${colorFor(p.prioridad)}"></span>
      <span class="info">
        <div class="name">${p.NOMBRE}</div>
        <div class="meta">Distrito ${p.distrito} &middot; CP ${p.CP ?? 'N/D'}</div>
      </span>
      <span class="score">${prio}</span>
    `;
    div.addEventListener('click', () => {
      const key = p.NOMBRE + '|' + p.distrito;
      const layer = featureLayerMap.get(key);
      if (layer) {
        map.fitBounds(layer.getBounds(), { maxZoom: 15 });
        layer.openPopup();
      }
    });
    listEl.appendChild(div);
  });
}

prioSlider.addEventListener('input', applyFilters);
chkD3.addEventListener('change', applyFilters);
chkD8.addEventListener('change', applyFilters);
chkDato.addEventListener('change', applyFilters);
searchBox.addEventListener('input', applyFilters);

applyFilters();

const initialLayer = L.geoJSON(DATA);
map.fitBounds(initialLayer.getBounds(), { padding:[20,20] });
</script>
